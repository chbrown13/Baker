# Proves Baker provisions on every platform it claims to support.
#
# **The unit suite runs on ubuntu only, and gates nothing.** It used to run on all
# seven targets ahead of the bake, which meant a test that merely *assumed* a
# platform — a hardcoded `/bin/sh`, a `\n` line ending, a non-root user — stopped
# the bake-and-assert steps from running at all. Every job failed at `npm test`
# and no platform coverage was ever demonstrated, which is the one thing this
# workflow exists to produce. The suite is not platform-neutral; the bake is the
# thing under test here, so the two are separated and neither blocks the other.
#
# The distro jobs run in containers driven by `docker run` rather than by the
# `container:` key, because actions-in-containers needs a glibc Node and Alpine
# does not have one. Checking out on the host and mounting the workspace keeps
# all three distros on the same, simpler path.
name: cross-platform

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # The unit suite, once, on the platform it is actually written against.
  # Deliberately has no `needs:` relationship with the bake jobs in either
  # direction: a red suite must not hide whether Baker still provisions.
  unit:
    name: unit suite (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit suite
        run: npm test

  # Host runners: a real end-to-end bake and its assertions.
  host:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: 'ubuntu (apt)',        manager: apt }
          - { os: macos-latest,  label: 'macos-arm (brew)',    manager: brew }
          - { os: macos-13,      label: 'macos-intel (brew)',  manager: brew }
          - { os: windows-latest, label: 'windows (choco)',    manager: choco }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bake the representative config
        working-directory: test/resources/cross-platform
        run: node ../../../baker.js bake

      - name: "Assert packages: installed jq"
        run: jq --version

      - name: "Assert config: rendered the template"
        shell: bash
        working-directory: test/resources/cross-platform
        run: |
          cat greeting.txt
          grep -q "hello from baker" greeting.txt

      - name: "Assert env: reached the user environment (POSIX)"
        if: runner.os != 'Windows'
        run: |
          grep -q "BAKER_E2E_TOKEN" ~/.baker/env.sh
          . ~/.baker/env.sh && test "$BAKER_E2E_TOKEN" = "verified-by-ci"

      - name: "Assert env: reached the user environment (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $value = [Environment]::GetEnvironmentVariable("BAKER_E2E_TOKEN", "User")
          if ($value -ne "verified-by-ci") { throw "expected verified-by-ci, got '$value'" }

      - name: Re-bake is a no-op, not an error
        working-directory: test/resources/cross-platform
        run: node ../../../baker.js bake

  # Distributions with no hosted runner. The container is the target, so this
  # also exercises the root/no-sudo path that docker-local provisioning uses.
  # No unit suite here either — see the note at the top.
  distro:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'fedora:latest'
            label: 'fedora (dnf)'
            prep: 'dnf install -y nodejs npm git findutils'
          - image: 'archlinux:latest'
            label: 'arch (pacman)'
            prep: 'pacman -Sy --noconfirm nodejs npm git'
          - image: 'alpine:latest'
            label: 'alpine (apk)'
            prep: 'apk add --no-cache nodejs npm git bash'
    steps:
      - uses: actions/checkout@v4

      - name: Bake inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/work -w /work ${{ matrix.image }} sh -c '
            set -e
            ${{ matrix.prep }}
            npm install --no-audit --no-fund
            cd test/resources/cross-platform
            node ../../../baker.js bake
            jq --version
            grep -q "hello from baker" greeting.txt
            grep -q BAKER_E2E_TOKEN ~/.baker/env.sh
            # Re-bake must converge rather than fail.
            node ../../../baker.js bake
          '
